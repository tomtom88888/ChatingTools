name: Build APK

# Runs on every push and can be started by hand from the Actions tab.
# The APK lands in the run's Artifacts section as "replylikeme-apk".
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # A universal (fat) APK, so it installs on any phone. It is signed with
      # the Android debug key — Flutter's default release signingConfig — which
      # is fine for sideloading and not acceptable for the Play Store. Add a
      # real keystore and signingConfig in android/app/build.gradle.kts before
      # publishing.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: replylikeme-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
