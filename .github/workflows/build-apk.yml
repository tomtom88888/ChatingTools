name: Build APK

# Runs on every push and can be started by hand from the Actions tab.
# The APK lands in the run's Artifacts section as "replylikeme-apk".
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease rather than a full release
        type: boolean
        default: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Needed only by the release step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Keeps the Gradle download between runs, so a GitHub hiccup serving
          # it doesn't fail the build.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The style-memory store is tested against real SQLite through
      # sqflite_common_ffi, which loads the system library.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter test

      # A universal (fat) APK, so it installs on any phone. It is signed with
      # android/app/sideload.keystore, the fixed key committed to the repo, so
      # every build can install over the last one. That is fine for sideloading
      # and not acceptable for the Play Store: replace it with your own
      # keystore, injected from CI secrets, before publishing.
      - run: flutter build apk --release

      # Also build one APK per ABI. The universal APK carries the Flutter engine
      # three times over and lands above 50 MB, which is awkward to pass around;
      # the arm64-v8a split is less than half that and covers essentially every
      # phone sold since 2017.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: replylikeme-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Artifacts need a logged-in browser to download, so every push to main
      # also publishes the APKs as a full release with a plain download link.
      # Main only moves when a feature is finished, so that is one release per
      # feature. Other branches and pull requests never publish; a hand-started
      # run ("Run workflow" in the Actions tab) does, and asks whether it is a
      # prerelease.
      - name: Publish the APK as a release
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          tag="v${version}-${GITHUB_SHA::7}"
          flags=()
          prerelease=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            prerelease="${{ inputs.prerelease }}"
          fi
          if [ "$prerelease" != "false" ]; then flags+=(--prerelease); fi
          mapfile -t apks < <(ls build/app/outputs/flutter-apk/*.apk)
          # A commit already released by hand is reused, and promoted if this
          # run is a full release.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${apks[@]}" \
              --target "$GITHUB_SHA" \
              --title "Ditto $version (${GITHUB_SHA::7})" \
              "${flags[@]}" \
              --notes "APKs built from $GITHUB_SHA, signed with the repository's sideload key: for sideloading only, not for the Play Store. Most phones want app-arm64-v8a-release.apk; app-release.apk is the universal build." \
              || true
          fi
          gh release upload "$tag" "${apks[@]}" --clobber
          if [ "$prerelease" = "false" ]; then
            gh release edit "$tag" --prerelease=false --latest
          fi
          echo "Release: $(gh release view "$tag" --json url --jq .url)"
