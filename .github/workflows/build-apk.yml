name: Build APK

# Runs on every push and can be started by hand from the Actions tab.
# The APK lands in the run's Artifacts section as "replylikeme-apk".
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Needed only by the release step below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The style-memory store is tested against real SQLite through
      # sqflite_common_ffi, which loads the system library.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter test

      # A universal (fat) APK, so it installs on any phone. It is signed with
      # android/app/sideload.keystore, the fixed key committed to the repo, so
      # every build can install over the last one. That is fine for sideloading
      # and not acceptable for the Play Store: replace it with your own
      # keystore, injected from CI secrets, before publishing.
      - run: flutter build apk --release

      # Also build one APK per ABI. The universal APK carries the Flutter engine
      # three times over and lands above 50 MB, which is awkward to pass around;
      # the arm64-v8a split is less than half that and covers essentially every
      # phone sold since 2017.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: replylikeme-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Artifacts need a logged-in browser to download. Running this workflow by
      # hand ("Run workflow" in the Actions tab) also publishes the APK as a
      # prerelease, which gives a plain download link. Ordinary pushes skip
      # this, so they never create releases.
      - name: Publish the APK as a prerelease
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="apk-${GITHUB_SHA::7}"
          mapfile -t apks < <(ls build/app/outputs/flutter-apk/*.apk)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${apks[@]}" --clobber
          else
            gh release create "$tag" "${apks[@]}" \
              --target "$GITHUB_SHA" \
              --title "ReplyLikeMe APK ($tag)" \
              --prerelease \
              --notes "Debug-signed APKs built from $GITHUB_SHA, for sideloading only - not signed for the Play Store. Most phones want app-arm64-v8a-release.apk; app-release.apk is the universal build."
          fi
          echo "Release: $(gh release view "$tag" --json url --jq .url)"
